<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云策计划 Agents 监控看板 V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #151932;
            --neon-cyan: #00ffff;
            --neon-purple: #b24bf3;
            --neon-pink: #ff0055;
            --neon-green: #00ff88;
            --neon-yellow: #ffd700;
            --neon-blue: #4d9fff;
            --text-primary: #e0e6ed;
            --text-secondary: #8892b0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 255, 0.03) 2px, rgba(0, 255, 255, 0.03) 4px),
                radial-gradient(circle at 20% 30%, rgba(178, 75, 243, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(100%); }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 52px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 10px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from { filter: brightness(1) drop-shadow(0 0 20px rgba(0, 255, 255, 0.6)); }
            to { filter: brightness(1.2) drop-shadow(0 0 40px rgba(178, 75, 243, 0.8)); }
        }

        /* 顶部统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            margin-bottom: 60px;
        }

        .stat-card {
            background: rgba(21, 25, 50, 0.6);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0, 255, 255, 0.4);
            border-color: var(--neon-cyan);
        }

        .stat-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .stat-value {
            font-family: 'Orbitron', monospace;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: numberPulse 2s ease-in-out infinite;
        }

        @keyframes numberPulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .stat-card.warning .stat-value {
            background: linear-gradient(135deg, var(--neon-yellow), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-card.danger .stat-value {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 机器人卡片 */
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--neon-cyan);
            margin-bottom: 30px;
            text-align: center;
        }

        .agents-carousel {
            display: flex;
            gap: 30px;
            overflow-x: auto;
            padding: 20px 0;
            margin-bottom: 60px;
        }

        .agent-card {
            min-width: 200px;
            background: rgba(21, 25, 50, 0.6);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .agent-card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            transform: translateY(-5px);
        }

        .agent-card.selected {
            border-color: var(--neon-cyan);
            background: rgba(0, 255, 255, 0.15);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            transform: scale(1.05);
        }

        .agent-card.selected::before {
            content: '✓ 已选中';
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 12px;
            color: var(--neon-cyan);
            font-weight: 700;
        }

        .agent-card.active {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            transform: scale(1.05);
        }

        .agent-avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .agent-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--neon-cyan);
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-primary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            font-weight: 900;
            color: var(--neon-cyan);
            overflow: hidden;
            cursor: pointer;
        }

        .agent-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-indicator {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 3px solid var(--bg-primary);
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .status-online { background: var(--neon-green); }
        .status-offline { background: #666; }
        .status-busy { background: var(--neon-yellow); }
        .status-error { background: var(--neon-pink); }

        .agent-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--neon-cyan);
            margin-bottom: 8px;
        }

        .agent-role {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 任务分析区域 */
        .tasks-analysis {
            background: rgba(21, 25, 50, 0.6);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }

        .analysis-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .analysis-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--neon-cyan);
            text-transform: uppercase;
        }

        /* 任务数量汇总 */
        .task-summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: rgba(10, 14, 39, 0.8);
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            position: relative;
        }

        .summary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            animation: borderGlow 3s linear infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .summary-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .summary-change {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
        }

        .summary-change.up {
            background: rgba(0, 255, 136, 0.2);
            color: var(--neon-green);
        }

        .summary-change.down {
            background: rgba(255, 0, 85, 0.2);
            color: var(--neon-pink);
        }

        .summary-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: var(--neon-cyan);
            margin-bottom: 10px;
        }

        .chart-container {
            height: 80px;
            position: relative;
        }

        /* 完成率分析 */
        .completion-analysis {
            margin-bottom: 15px;
        }

        .analysis-subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--neon-purple);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .completion-overall {
            background: rgba(10, 14, 39, 0.8);
            border: 2px solid rgba(178, 75, 243, 0.3);
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 10px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .progress-bar-bg {
            height: 16px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            border-radius: 8px;
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.6);
            position: relative;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }

        .agent-completion-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .agent-completion-item {
            background: rgba(10, 14, 39, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 6px;
            padding: 8px 10px;
        }

        .agent-completion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .agent-completion-name {
            font-weight: 700;
            color: var(--neon-cyan);
            font-size: 11px;
        }

        .agent-completion-rate {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: var(--neon-green);
            font-size: 11px;
        }

        .mini-progress {
            height: 4px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 2px;
            overflow: hidden;
        }

        .mini-progress-fill {
            height: 100%;
            background: var(--neon-green);
            border-radius: 2px;
            transition: width 1s;
        }

        /* 协同分析 */
        .collaboration-analysis {
            margin-bottom: 15px;
        }

        /* 类型分布与协同分析并排 */
        .type-collab-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .type-panel {
            background: rgba(10, 14, 39, 0.8);
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 12px;
            padding: 15px;
        }

        .collab-panel {
            background: rgba(10, 14, 39, 0.8);
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 12px;
            padding: 15px;
        }

        .collab-panel-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--neon-green);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .top-initiators {
            list-style: none;
        }

        .initiator-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
        }

        .initiator-rank {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            color: var(--neon-yellow);
            width: 30px;
        }

        .initiator-name {
            flex: 1;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 13px;
        }

        .initiator-count {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: var(--neon-cyan);
            font-size: 13px;
        }

        /* 机器人汇总统计 */
        .agent-summary-panel {
            background: rgba(10, 14, 39, 0.8);
            border: 2px solid rgba(178, 75, 243, 0.4);
            border-radius: 16px;
            padding: 20px 25px;
            margin-bottom: 25px;
            display: none;
        }

        .agent-summary-panel.show {
            display: block;
        }

        .agent-summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(0, 255, 255, 0.2);
        }

        .agent-summary-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--neon-cyan);
        }

        .agent-summary-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .agent-stat-item {
            text-align: center;
        }

        .agent-stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .agent-stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--neon-cyan);
        }

        .agent-stat-value.success {
            color: var(--neon-green);
        }

        .agent-stat-value.warning {
            color: var(--neon-yellow);
        }

        /* 任务明细表格 */
        .tasks-table-section {
            background: rgba(21, 25, 50, 0.6);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .table-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--neon-cyan);
            text-transform: uppercase;
        }

        .refresh-btn {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            border: none;
            color: var(--bg-primary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            box-shadow: 0 6px 30px rgba(0, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .tasks-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
            table-layout: fixed;
        }

        .tasks-table thead tr {
            background: rgba(0, 255, 255, 0.1);
        }

        .tasks-table th {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 16px;
            text-align: left;
            color: var(--neon-cyan);
            border-bottom: 2px solid var(--neon-cyan);
        }

        /* 列宽控制 */
        .tasks-table th:nth-child(1),
        .tasks-table td:nth-child(1) { width: 6%; }  /* 任务ID */
        .tasks-table th:nth-child(2),
        .tasks-table td:nth-child(2) { width: 10%; } /* 任务类型 */
        .tasks-table th:nth-child(3),
        .tasks-table td:nth-child(3) { width: 8%; }  /* 完成质量 */
        .tasks-table th:nth-child(4),
        .tasks-table td:nth-child(4) { width: 8%; }  /* 发起人 */
        .tasks-table th:nth-child(5),
        .tasks-table td:nth-child(5) { width: 9%; }  /* 执行时长 */
        .tasks-table th:nth-child(6),
        .tasks-table td:nth-child(6) { width: 11%; } /* 完成时间 */
        .tasks-table th:nth-child(7),
        .tasks-table td:nth-child(7) { width: 8%; }  /* 状态 */
        .tasks-table th:nth-child(8),
        .tasks-table td:nth-child(8) { width: 40%; } /* 执行成果 */

        .tasks-table tbody tr {
            background: rgba(21, 25, 50, 0.4);
            transition: all 0.3s;
        }

        .tasks-table tbody tr:hover {
            background: rgba(0, 255, 255, 0.05);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .tasks-table td {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            padding: 20px 16px;
            color: var(--text-primary);
            word-wrap: break-word;
            overflow-wrap: break-word;
            vertical-align: top;
        }

        /* 执行成果列特殊处理 */
        .tasks-table td:nth-child(8) {
            font-size: 13px;
            line-height: 1.6;
            max-height: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .task-id {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-purple);
            font-weight: 700;
        }

        .task-type {
            display: inline-block;
            padding: 6px 12px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            border-radius: 6px;
            font-size: 12px;
            color: var(--neon-cyan);
        }

        .quality-stars {
            color: var(--neon-yellow);
            font-size: 16px;
        }

        .task-status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .task-status.completed {
            background: rgba(0, 255, 136, 0.2);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }

        .task-status.running {
            background: rgba(255, 215, 0, 0.2);
            color: var(--neon-yellow);
            border: 1px solid var(--neon-yellow);
            animation: statusBlink 1.5s infinite;
        }

        .task-status.error {
            background: rgba(255, 0, 85, 0.2);
            color: var(--neon-pink);
            border: 1px solid var(--neon-pink);
        }

        @keyframes statusBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .task-summary { grid-template-columns: 1fr; }
            .agent-completion-grid { grid-template-columns: repeat(2, 1fr); }
            .type-collab-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">云策计划 Agents 监控看板</h1>
        </header>

        <!-- 顶部统计 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">任务总数</div>
                <div class="stat-value" id="totalTasks">96</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-label">正在执行</div>
                <div class="stat-value" id="runningTasks">1</div>
            </div>
            <div class="stat-card danger">
                <div class="stat-label">异常任务</div>
                <div class="stat-value" id="errorTasks">1</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">机器人在线</div>
                <div class="stat-value" id="onlineAgents">5/7</div>
            </div>
        </div>

        <!-- 任务数据分析 -->
        <div class="tasks-analysis">
            <div class="analysis-header">
                <h3 class="analysis-title">任务数据分析</h3>
            </div>

            <!-- 任务数量汇总 -->
            <div class="task-summary">
                <div class="summary-card">
                    <div class="summary-header">
                        <span class="summary-label">任务总量</span>
                        <span class="summary-change up">↑ 12%</span>
                    </div>
                    <div class="summary-value" id="summaryTotal">96</div>
                    <div class="chart-container">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>

                <div class="summary-card">
                    <div class="summary-header">
                        <span class="summary-label">任务状态分布</span>
                    </div>
                    <div class="chart-container">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 完成率分析 -->
            <div class="completion-analysis">
                <h4 class="analysis-subtitle">任务完成率分析</h4>

                <div class="completion-overall">
                    <div class="progress-label">
                        <span style="font-weight: 700; font-size: 13px;">整体完成率</span>
                        <span style="font-family: 'Orbitron'; font-size: 16px; font-weight: 900; color: var(--neon-green);" id="overallRate">97.9%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="overallProgress" style="width: 0%"></div>
                    </div>
                </div>

                <div class="agent-completion-grid" id="agentCompletionGrid"></div>
            </div>

            <!-- 类型分布与协同分析 -->
            <div class="type-collab-row">
                <div class="type-panel">
                    <div class="collab-panel-title">📈 任务类型分布</div>
                    <div class="chart-container" style="height: 150px;">
                        <canvas id="typeChart"></canvas>
                    </div>
                </div>

                <div class="collab-panel">
                    <div class="collab-panel-title">📊 发起人TOP5</div>
                    <ul class="top-initiators" id="topInitiators"></ul>
                </div>
            </div>
        </div>

        <!-- 机器人选择 -->
        <h2 class="section-title">选择 Agent 查看任务</h2>
        <div class="agents-carousel" id="agentsCarousel"></div>

        <!-- 任务明细表格 -->
        <div class="tasks-table-section">
            <div class="table-header">
                <h3 class="table-title" id="tableTitle">任务明细</h3>
                <button class="refresh-btn" onclick="refreshData()">刷新数据</button>
            </div>

            <!-- 机器人汇总统计面板 -->
            <div class="agent-summary-panel" id="agentSummaryPanel">
                <div class="agent-summary-header">
                    <span class="agent-summary-title" id="agentSummaryTitle">机器人汇总</span>
                </div>
                <div class="agent-summary-stats">
                    <div class="agent-stat-item">
                        <div class="agent-stat-label">总任务数</div>
                        <div class="agent-stat-value" id="agentTotalTasks">0</div>
                    </div>
                    <div class="agent-stat-item">
                        <div class="agent-stat-label">已完成</div>
                        <div class="agent-stat-value success" id="agentCompletedTasks">0</div>
                    </div>
                    <div class="agent-stat-item">
                        <div class="agent-stat-label">执行中</div>
                        <div class="agent-stat-value warning" id="agentRunningTasks">0</div>
                    </div>
                    <div class="agent-stat-item">
                        <div class="agent-stat-label">完成率</div>
                        <div class="agent-stat-value success" id="agentCompletionRate">100%</div>
                    </div>
                </div>
            </div>

            <table class="tasks-table">
                <thead>
                    <tr>
                        <th>任务ID</th>
                        <th>任务类型</th>
                        <th>完成质量</th>
                        <th>发起人</th>
                        <th>执行时长</th>
                        <th>完成时间</th>
                        <th>状态</th>
                        <th>执行成果</th>
                    </tr>
                </thead>
                <tbody id="tasksTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let agentsData = [];
        let tasksData = [];
        let analyticsData = null; // 存储analytics数据
        let selectedAgentId = null; // null表示显示全部，否则显示指定agent的任务
        let charts = {};

        async function init() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                agentsData = data.agents || [];
                tasksData = data.tasks || [];
                analyticsData = data.analytics || null; // 保存analytics数据
                updateStats(data.stats);
            } catch (error) {
                tasksData = generateMockTasks();
            }

            renderAgents();
            renderAnalytics();
            renderTasks();

            // 动画启动完成率进度条
            setTimeout(() => {
                document.getElementById('overallProgress').style.width = '97.9%';
            }, 500);
        }

        function generateMockTasks() {
            const types = ['消息处理', '信息查询', '内容生成', '技能分享', '系统监控'];
            const initiators = ['pengxinghui', 'wangjinglan', 'gaozixing', 'ouqingxia_sz', 'liyinyu_sh'];
            const statuses = ['completed', 'completed', 'completed', 'completed', 'running', 'error'];

            return Array.from({ length: 30 }, (_, i) => ({
                id: i + 1,
                agentId: Math.floor(Math.random() * 7) + 1,
                type: types[Math.floor(Math.random() * types.length)],
                quality: Math.floor(Math.random() * 2) + 4,
                initiator: initiators[Math.floor(Math.random() * initiators.length)],
                duration: `${Math.floor(Math.random() * 5) + 1}-${Math.floor(Math.random() * 3) + 3}分钟`,
                status: statuses[Math.floor(Math.random() * statuses.length)],
                result: '任务执行成功',
                time: `2026-05-0${Math.floor(Math.random() * 3) + 1} ${Math.floor(Math.random() * 12) + 10}:${String(Math.floor(Math.random() * 60)).padStart(2, '0')}`
            }));
        }

        function updateStats(stats) {
            if (stats) {
                document.getElementById('totalTasks').textContent = stats.total || 96;
                document.getElementById('runningTasks').textContent = stats.running || 1;
                document.getElementById('errorTasks').textContent = stats.error || 1;
                document.getElementById('summaryTotal').textContent = stats.total || 96;
            }
        }

        function renderAgents() {
            const carousel = document.getElementById('agentsCarousel');
            // 添加"全部"选项
            let allAgentHtml = `
                <div class="agent-card ${selectedAgentId === null ? 'selected' : ''}" onclick="selectAgent(null)">
                    <div class="agent-avatar-wrapper">
                        <div class="agent-avatar">
                            <span>全</span>
                        </div>
                        <div class="status-indicator status-online"></div>
                    </div>
                    <div class="agent-name">全部机器人</div>
                    <div class="agent-role">查看所有任务</div>
                </div>
            `;

            carousel.innerHTML = allAgentHtml + agentsData.map(agent => {
                // 判断avatar是否为URL(以http开头)
                const isImageUrl = agent.avatar && agent.avatar.startsWith('http');
                const avatarContent = isImageUrl
                    ? `<img src="${agent.avatar}" alt="${agent.name}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`
                    : `<span>${agent.avatar}</span>`;

                return `
                <div class="agent-card ${agent.id === selectedAgentId ? 'selected' : ''}" onclick="selectAgent(${agent.id})">
                    <div class="agent-avatar-wrapper">
                        <div class="agent-avatar">
                            ${avatarContent}
                        </div>
                        <div class="status-indicator status-${agent.status}"></div>
                    </div>
                    <div class="agent-name">${agent.name}</div>
                    <div class="agent-role">${agent.role}</div>
                </div>
                `;
            }).join('');
        }

        function selectAgent(agentId) {
            selectedAgentId = agentId;
            renderAgents(); // 重新渲染以更新选中状态

            const summaryPanel = document.getElementById('agentSummaryPanel');

            if (agentId === null) {
                // 显示全部任务
                document.getElementById('tableTitle').textContent = `任务明细（全部 ${tasksData.length} 条）`;
                summaryPanel.classList.remove('show');
            } else {
                // 显示特定机器人的任务
                const agent = agentsData.find(a => a.id === agentId);
                const agentTasks = tasksData.filter(t => t.agentId === agentId);

                // 更新标题
                document.getElementById('tableTitle').textContent = `${agent.name} 的任务明细（${agentTasks.length} 条）`;

                // 计算统计数据
                const completedCount = agentTasks.filter(t => t.status === 'completed').length;
                const runningCount = agentTasks.filter(t => t.status === 'running').length;
                const completionRate = agentTasks.length > 0 ? ((completedCount / agentTasks.length) * 100).toFixed(1) : 100;

                // 更新汇总面板
                document.getElementById('agentSummaryTitle').textContent = `${agent.name} 机器人汇总`;
                document.getElementById('agentTotalTasks').textContent = agentTasks.length;
                document.getElementById('agentCompletedTasks').textContent = completedCount;
                document.getElementById('agentRunningTasks').textContent = runningCount;
                document.getElementById('agentCompletionRate').textContent = `${completionRate}%`;

                // 显示面板
                summaryPanel.classList.add('show');
            }

            renderTasks();
        }

        function renderAnalytics() {
            // 获取真实数据或使用默认值
            const weeklyTrend = analyticsData?.weeklyTrend || [12, 19, 15, 18, 14, 12, 6];
            const typeDistribution = analyticsData?.typeDistribution || {
                '消息处理': 40,
                '信息查询': 25,
                '内容生成': 15,
                '技能分享': 10,
                '系统监控': 10
            };

            // 趋势图
            const trendCtx = document.getElementById('trendChart').getContext('2d');
            charts.trend = new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                    datasets: [{
                        label: '任务数',
                        data: weeklyTrend,
                        borderColor: '#00ffff',
                        backgroundColor: 'rgba(0, 255, 255, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { ticks: { color: '#8892b0' }, grid: { color: 'rgba(0, 255, 255, 0.1)' } },
                        x: { ticks: { color: '#8892b0' }, grid: { display: false } }
                    }
                }
            });

            // 类型分布图 - 柱状图
            const typeCtx = document.getElementById('typeChart').getContext('2d');
            const typeLabels = Object.keys(typeDistribution);
            const typeValues = Object.values(typeDistribution);
            const typeColors = ['#00ffff', '#b24bf3', '#00ff88', '#ffd700', '#ff0055'];

            charts.type = new Chart(typeCtx, {
                type: 'bar',
                data: {
                    labels: typeLabels,
                    datasets: [{
                        label: '任务数量',
                        data: typeValues,
                        backgroundColor: typeColors.slice(0, typeLabels.length),
                        borderColor: typeColors.slice(0, typeLabels.length),
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#8892b0', font: { size: 10 } },
                            grid: { color: 'rgba(0, 255, 255, 0.1)' }
                        },
                        x: {
                            ticks: { color: '#8892b0', font: { size: 10 } },
                            grid: { display: false }
                        }
                    }
                }
            });

            // 状态分布图
            const statusCtx = document.getElementById('statusChart').getContext('2d');
            charts.status = new Chart(statusCtx, {
                type: 'bar',
                data: {
                    labels: ['已完成', '执行中', '异常'],
                    datasets: [{
                        data: [94, 1, 1],
                        backgroundColor: ['#00ff88', '#ffd700', '#ff0055']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { ticks: { color: '#8892b0' }, grid: { color: 'rgba(0, 255, 255, 0.1)' } },
                        x: { ticks: { color: '#8892b0' }, grid: { display: false } }
                    }
                }
            });

            // Agent完成率
            const grid = document.getElementById('agentCompletionGrid');
            const agentRates = [
                { name: 'dodo', rate: 98 },
                { name: '张良', rate: 100 },
                { name: '萧何', rate: 95 },
                { name: '干将', rate: 96 },
                { name: '莫邪', rate: 100 },
                { name: '鲁班', rate: 90 },
                { name: '子期', rate: 100 }
            ];

            grid.innerHTML = agentRates.map(item => `
                <div class="agent-completion-item">
                    <div class="agent-completion-header">
                        <span class="agent-completion-name">${item.name}</span>
                        <span class="agent-completion-rate">${item.rate}%</span>
                    </div>
                    <div class="mini-progress">
                        <div class="mini-progress-fill" style="width: ${item.rate}%"></div>
                    </div>
                </div>
            `).join('');

            // TOP5发起人
            const initiators = [
                { name: 'pengxinghui', count: 25 },
                { name: 'wangjinglan', count: 18 },
                { name: 'gaozixing', count: 15 },
                { name: 'ouqingxia_sz', count: 12 },
                { name: 'liyinyu_sh', count: 10 }
            ];

            document.getElementById('topInitiators').innerHTML = initiators.map((item, index) => `
                <li class="initiator-item">
                    <span class="initiator-rank">#${index + 1}</span>
                    <span class="initiator-name">${item.name}</span>
                    <span class="initiator-count">${item.count}个</span>
                </li>
            `).join('');
        }

        function renderTasks() {
            const tbody = document.getElementById('tasksTableBody');
            // 根据selectedAgentId过滤任务
            const filteredTasks = selectedAgentId === null
                ? tasksData
                : tasksData.filter(t => t.agentId === selectedAgentId);

            tbody.innerHTML = filteredTasks.map(task => `
                <tr>
                    <td class="task-id">#${String(task.id).padStart(4, '0')}</td>
                    <td><span class="task-type">${task.type}</span></td>
                    <td><span class="quality-stars">${'★'.repeat(task.quality)}${'☆'.repeat(5 - task.quality)}</span></td>
                    <td>${task.initiator}</td>
                    <td>${task.duration}</td>
                    <td>${task.time}</td>
                    <td><span class="task-status ${task.status}">${getStatusText(task.status)}</span></td>
                    <td>${task.result}</td>
                </tr>
            `).join('');
        }

        function getStatusText(status) {
            return { 'completed': '已完成', 'running': '执行中', 'error': '异常' }[status] || status;
        }

        async function refreshData() {
            await init();
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
